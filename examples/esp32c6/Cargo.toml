[package]
name = "esp32c6"
version = "0.1.0"
authors = ["Scott Mabin <scott@mabez.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32c6", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16.1", features = ["esp32c6"] }
log = { version = "0.4.29" }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embassy-executor = { version = "0.6.3",  features = ["task-arena-size-8192"] }
embedded-hal-async = "1"

embedded-io = "0.7.0"
embedded-io-async = "0.7.0"

sdspi = { version = "0.1.0", path = "../../sdspi", features = ["log"] }
aligned = "0.4.2"
block-device-adapters = { version = "0.2.0", path = "../../block-device-adapters" }
embedded-fatfs = { version = "0.1.0", path = "../../embedded-fatfs", default-features = false, features = ["log"] }
